<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>强运家族：购物蛇 v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="startScreen" class="screen start-screen">
      <div class="panel hero">
        <div class="eyebrow">LUCKY DYNASTY</div>
        <h1>强运家族</h1>
        <p>刮彩票决定本局预算，进入人生商场自动前进扫货。碰到商品就买，拖着资产回家结算。</p>
        <button id="startBtn" class="primary-btn">开始刮彩票</button>
      </div>
    </section>

    <section id="lotteryScreen" class="screen lottery-screen hidden">
      <div class="topbar">
        <div>
          <div class="tiny">GENERATION</div>
          <strong>第 <span id="genText">1</span> 代</strong>
        </div>
        <div class="wealth-mini">总资产 <span id="totalAssetText">¥0</span></div>
      </div>

      <div class="panel lottery-panel">
        <div class="eyebrow">SCRATCH TICKET</div>
        <h2>强运刮刮乐</h2>
        <p>刮开涂层，看看这一局你能带多少钱进商场。</p>

        <div class="ticket-wrap">
          <div class="ticket-base">
            <div class="ticket-label">本局预算</div>
            <div id="prizeText" class="prize-text">???</div>
            <div id="tierText" class="tier-text">刮开揭晓</div>
          </div>
          <canvas id="scratchCanvas"></canvas>
        </div>

        <button id="enterMallBtn" class="primary-btn hidden">拿钱进商场</button>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="hud">
        <div class="hud-card">
          <span>预算</span>
          <strong id="budgetText">¥0</strong>
        </div>
        <div class="hud-card">
          <span>已花</span>
          <strong id="spentText">¥0</strong>
        </div>
        <div class="hud-card">
          <span>剩余</span>
          <strong id="cashLeftText">¥0</strong>
        </div>
        <div class="hud-card danger">
          <span>警告</span>
          <strong id="warningText">0/1</strong>
        </div>
      </header>

      <main class="game-wrap">
        <canvas id="gameCanvas"></canvas>
        <div id="gameMessage" class="game-message hidden"></div>
      </main>

      <div class="controls">
        <button id="leftBtn" class="turn-btn">↶ 左转</button>
        <button id="rightBtn" class="turn-btn">右转 ↷</button>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen hidden">
      <div class="panel result-panel">
        <div class="eyebrow">RESULT</div>
        <h2 id="resultTitle">本局结算</h2>
        <p id="resultDesc"></p>
        <div class="result-grid">
          <div><span>本局预算</span><strong id="resultBudget">¥0</strong></div>
          <div><span>购买价值</span><strong id="resultSpent">¥0</strong></div>
          <div><span>剩余现金</span><strong id="resultLeft">¥0</strong></div>
          <div><span>本局购买</span><strong id="resultCount">0 件</strong></div>
        </div>
        <h3>资产栏</h3>
        <div id="inventoryGrid" class="inventory-grid"></div>
        <button id="nextRoundBtn" class="primary-btn">继续刮下一张</button>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
