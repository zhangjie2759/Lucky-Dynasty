<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>强运家族：购物蛇 2D版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="startScreen" class="panel start-panel">
      <div class="brand">LUCKY DYNASTY</div>
      <h1>强运家族</h1>
      <p>刮开一张彩票，拿着这笔钱冲进商场。碰到什么就买什么，钱花爆之前把战利品带回家。</p>
      <button id="startBtn" class="primary">开始刮奖</button>
    </section>

    <section id="lotteryScreen" class="panel hidden">
      <div class="top-row">
        <div>
          <div class="label">ROUND</div>
          <h2>第 <span id="roundText">1</span> 局彩票</h2>
        </div>
        <div class="cash-pill">总资产 <span id="totalAssetsText">¥0</span></div>
      </div>

      <div class="ticket-card">
        <div class="ticket-head">
          <span>强运刮刮乐</span>
          <strong id="ticketCode">000 000 000</strong>
        </div>
        <div class="scratch-wrap">
          <div class="prize-reveal">
            <div>本局预算</div>
            <strong id="prizeText">¥???</strong>
            <small id="tierText">刮开后进入购物蛇</small>
          </div>
          <canvas id="scratchCanvas"></canvas>
        </div>
        <button id="quickScratchBtn" class="secondary">一键刮开</button>
      </div>

      <div id="prizeResult" class="result-box hidden">
        <h3 id="resultTitle">中奖了！</h3>
        <p id="resultDesc">用这笔钱买到最高价值，然后回家结算。</p>
        <button id="enterMallBtn" class="primary">进入商场扫货</button>
      </div>
    </section>

    <section id="gameScreen" class="hidden game-screen">
      <header class="hud">
        <div class="hud-item"><span>预算</span><b id="budgetText">¥0</b></div>
        <div class="hud-item"><span>已买</span><b id="spentText">¥0</b></div>
        <div class="hud-item"><span>剩余</span><b id="remainText">¥0</b></div>
      </header>

      <canvas id="gameCanvas"></canvas>

      <div id="toast" class="toast hidden"></div>

      <div class="controls">
        <button id="leftBtn" class="turn-btn">↺ 左转</button>
        <button id="rightBtn" class="turn-btn">右转 ↻</button>
      </div>

      <div class="hint-bar">
        自动前进，不能停止。碰到商品自动购买，回到绿色“家”结算。
      </div>
    </section>

    <section id="summaryScreen" class="panel hidden">
      <div class="brand">RESULT</div>
      <h2 id="summaryTitle">本局结算</h2>
      <div id="summaryStats" class="summary-stats"></div>
      <div id="inventoryList" class="inventory-list"></div>
      <button id="nextRoundBtn" class="primary">继续刮下一张</button>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
