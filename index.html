<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>强运家族 · 购物蛇原型</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="startScreen" class="screen start-screen">
      <div class="start-card">
        <div class="eyebrow">LUCKY DYNASTY</div>
        <h1>强运家族</h1>
        <p>刮出本局预算，进入同一张人生商场。碰到商品就自动购买，钱花完前把战利品拖回家。</p>
        <button id="startBtn" class="primary-btn">开始刮一张命</button>
      </div>
    </section>

    <section id="lotteryScreen" class="screen lottery-screen hidden">
      <header class="topbar">
        <div>
          <div class="tiny-label">ROUND</div>
          <strong>第 <span id="roundText">1</span> 张强运彩票</strong>
        </div>
        <button id="resetBtn" class="mini-btn">重开</button>
      </header>

      <main class="lottery-card">
        <div class="prize-ladder">
          <span>几千</span><span>几万</span><span>几十万</span><span>几百万</span><span>几千万</span><span>上亿</span>
        </div>
        <div class="winning-code">
          <span>本期中奖码</span>
          <strong id="winCodeText">000 000 000</strong>
        </div>
        <div class="scratch-wrap">
          <div class="scratch-under">
            <span>你的号码</span>
            <strong id="myCodeText">??? ??? ???</strong>
            <em id="scratchHint">拖动刮开涂层</em>
          </div>
          <canvas id="scratchCanvas"></canvas>
        </div>
        <button id="revealBtn" class="primary-btn wide">我刮完了，开奖</button>
      </main>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="hud">
        <div class="hud-box">
          <span>本局预算</span>
          <strong id="budgetText">¥0</strong>
        </div>
        <div class="hud-box danger">
          <span>剩余现金</span>
          <strong id="cashText">¥0</strong>
        </div>
        <div class="hud-box">
          <span>已购价值</span>
          <strong id="spentText">¥0</strong>
        </div>
        <div class="hud-box">
          <span>资产数</span>
          <strong id="countText">0</strong>
        </div>
      </header>

      <div class="game-stage">
        <canvas id="gameCanvas"></canvas>
        <div id="toast" class="toast hidden"></div>
        <div class="map-tip">拖动摇杆移动｜碰到商品自动购买｜回到 🏠 家 结算</div>
      </div>

      <div id="joystick" class="joystick">
        <div id="stick" class="stick"></div>
      </div>

      <aside class="asset-drawer">
        <button id="assetToggle" class="asset-toggle">资产栏 <span id="assetTotalMini">0</span></button>
        <div id="assetPanel" class="asset-panel hidden">
          <div class="asset-head">
            <strong>累计资产</strong>
            <span id="assetValueText">¥0</span>
          </div>
          <div id="assetList" class="asset-list"></div>
        </div>
      </aside>
    </section>

    <section id="resultScreen" class="screen result-screen hidden">
      <div class="result-card">
        <div class="eyebrow">SHOPPING RESULT</div>
        <h1 id="resultTitle">成功回家</h1>
        <p id="resultDesc">你把本局战利品带回了家。</p>
        <div id="resultStats" class="result-stats"></div>
        <button id="nextRoundBtn" class="primary-btn">继续刮下一张</button>
      </div>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
